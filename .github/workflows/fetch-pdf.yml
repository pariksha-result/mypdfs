name: Fetch PDF from URL

on:
  workflow_dispatch:
    inputs:
      pdf_url:
        description: 'PDF ka direct URL'
        required: true
      file_name:
        description: 'Save karne ke liye filename (jaise: railway-alp.pdf)'
        required: true

jobs:
  fetch-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Download PDF
        run: |
          curl -L "${{ github.event.inputs.pdf_url }}" -o "${{ github.event.inputs.file_name }}"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "${{ github.event.inputs.file_name }}"
          git commit -m "Added ${{ github.event.inputs.file_name }} via URL fetch"
          git push
